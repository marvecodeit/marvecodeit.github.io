<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue",
          Helvetica, Arial, sans-serif;
        background: #07130c;
        color: #f2f8f4;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 82% 34%,
            rgba(53, 173, 98, 0.34),
            transparent 38%
          ),
          linear-gradient(135deg, #07130c 0%, #0a1f12 48%, #0d2f19 100%);
      }

      .dots {
        position: absolute;
        inset: 0;
        opacity: 0.18;
        background-image: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.7) 1px,
          transparent 1.2px
        );
        background-size: 26px 26px;
        -webkit-mask-image: radial-gradient(
          ellipse 70% 90% at 78% 50%,
          #000 0%,
          transparent 72%
        );
        mask-image: radial-gradient(
          ellipse 70% 90% at 78% 50%,
          #000 0%,
          transparent 72%
        );
      }

      .rings {
        position: absolute;
        right: -140px;
        top: -100px;
        width: 760px;
        height: 760px;
        opacity: 0.5;
      }

      .content {
        position: absolute;
        left: 72px;
        top: 62px;
        width: 690px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand img {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.35),
          0 0 0 1px rgba(255, 255, 255, 0.12);
      }

      .brand span {
        font-size: 25px;
        font-weight: 650;
        letter-spacing: -0.03em;
      }

      .eyebrow {
        margin-top: 64px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.65);
      }

      .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #5ad488;
        box-shadow: 0 0 8px rgba(90, 212, 136, 0.8);
      }

      h1 {
        margin: 24px 0 0;
        font-size: 68px;
        line-height: 1.01;
        letter-spacing: -0.052em;
        font-weight: 660;
        max-width: 680px;
      }

      h1 .green {
        color: #5ad488;
      }

      .sub {
        margin: 22px 0 0;
        font-size: 23px;
        line-height: 1.4;
        color: rgba(255, 255, 255, 0.6);
        letter-spacing: -0.015em;
      }

      .meta {
        margin-top: 42px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.48);
      }

      .meta .sep {
        width: 1px;
        height: 13px;
        background: rgba(255, 255, 255, 0.18);
      }

      .visual {
        position: absolute;
        right: 92px;
        top: 168px;
        width: 330px;
        height: 330px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .visual .glow {
        position: absolute;
        width: 360px;
        height: 360px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(90, 212, 136, 0.3),
          transparent 66%
        );
        filter: blur(14px);
      }

      .visual .app-icon {
        position: relative;
        z-index: 2;
        width: 236px;
        height: 236px;
        border-radius: 54px;
        box-shadow:
          0 30px 70px rgba(0, 0, 0, 0.42),
          0 0 0 1px rgba(255, 255, 255, 0.14);
      }

      .chip {
        position: absolute;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(9, 24, 15, 0.8);
        padding: 9px 13px;
        font-size: 12px;
        font-weight: 550;
        color: rgba(255, 255, 255, 0.82);
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(8px);
      }

      .chip .status {
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }

      .chip-one {
        left: -60px;
        top: 48px;
      }

      .chip-one .status {
        background: #f0b35e;
      }

      .chip-two {
        right: -54px;
        bottom: 52px;
      }

      .chip-two .status {
        background: #5ad488;
      }

      .url {
        position: absolute;
        right: 72px;
        bottom: 40px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.32);
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dots"></div>
      <svg class="rings" viewBox="0 0 760 760" fill="none">
        <circle cx="380" cy="380" r="150" stroke="white" stroke-opacity="0.1" />
        <circle cx="380" cy="380" r="230" stroke="white" stroke-opacity="0.08" />
        <circle cx="380" cy="380" r="310" stroke="white" stroke-opacity="0.06" />
        <circle cx="380" cy="380" r="380" stroke="white" stroke-opacity="0.04" />
      </svg>

      <div class="content">
        <div class="brand">
          <img src="../public/app-icon.png" alt="" />
          <span>AirLink</span>
        </div>

        <div class="eyebrow">
          <span class="dot"></span>
          A native macOS utility
        </div>

        <h1>
          The missing link between <span class="green">Wi-Fi</span> and the
          internet.
        </h1>

        <p class="sub">Captive portals, handled.</p>

        <div class="meta">
          <span>macOS 12 or later</span>
          <span class="sep"></span>
          <span>Free and open source</span>
          <span class="sep"></span>
          <span>No account required</span>
        </div>
      </div>

      <div class="visual">
        <div class="glow"></div>
        <img class="app-icon" src="../public/icon-512.png" alt="" />
        <div class="chip chip-one">
          <span class="status"></span>
          Portal detected
        </div>
        <div class="chip chip-two">
          <span class="status"></span>
          HTTPS verified
        </div>
      </div>

      <div class="url">marvecodeit.github.io/airlink</div>
    </div>
  </body>
</html>
