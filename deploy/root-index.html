<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AirLink for macOS</title>
    <meta
      name="description"
      content="AirLink is a native macOS captive portal assistant by marvecodeit."
    />
    <link rel="canonical" href="https://marvecodeit.github.io/airlink/" />
    <meta http-equiv="refresh" content="0; url=/airlink/" />
    <script>
      window.location.replace("/airlink/");
    </script>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
          Helvetica, Arial, sans-serif;
        background: #f6f8fa;
        color: #10231a;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.5rem;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        color: #586a60;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 1.25rem;
        color: #0b5c28;
        font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #0a110d;
          color: #eaf2ec;
        }
        p {
          color: #a5b5aa;
        }
        a {
          color: #8fe3ab;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/airlink/app-icon.png" alt="AirLink app icon" />
      <h1>AirLink</h1>
      <p>Taking you to the AirLink website&hellip;</p>
      <a href="/airlink/">Open AirLink</a>
    </main>
  </body>
</html>
