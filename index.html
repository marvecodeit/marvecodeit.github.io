    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AirLink" />
    <meta property="og:title" content="AirLink — Captive portals, handled." />
    <meta
      property="og:description"
      content="Detect captive portals, sign in through a secure built-in browser, and verify your Mac is really online. A native macOS utility by marvecodeit."

    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />

    <script>
      // Apply the saved appearance before the first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem("airlink-theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (_) {
          /* appearance preference is optional */
        }
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "AirLink",
        "operatingSystem": "macOS 12 or later",
        "applicationCategory": "UtilitiesApplication",
        "description": "A native macOS captive portal assistant that detects sign-in portals, opens the network's real sign-in page in a secure built-in browser, and verifies system-wide internet access.",

        "isAccessibleForFree": true,
        "author": {
          "@type": "Person",
          "name": "marvecodeit",

        }
      }
    </script>
